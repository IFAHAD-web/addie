<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أداة ADDIE للمدربين</title>
<meta name="description" content="أداة عملية ومجانية للمدربين: صمّم برنامجك التدريبي بنموذج ADDIE خطوة بخطوة، ونزّل خطتك كملف Excel منسّق. إعداد فهد الشمري.">
<meta name="author" content="فهد الشمري">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<meta property="og:title" content="أداة ADDIE للمدربين">
<meta property="og:description" content="صمّم برنامجك التدريبي بنموذج ADDIE خطوة بخطوة، ونزّل خطتك كملف Excel منسّق.">
<meta name="theme-color" content="#0F2A4A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F2A4A'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%238EC0FF'%3EA%3C/text%3E%3C/svg%3E">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
<style>
/* Layout: one reading column under a sticky station bar; two modes — "apply" walks the trainer through seven stations, "learn" reads top to bottom */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#E9EEF4; --line:#DDE3EC; --ink:#0F1B2D; --muted:#4F5B70; --faint:#5F6B80;
  --brand:#0F2A4A; --brand-soft:#E8F0FA; --on-brand:#FFFFFF; --gold:#2F7FD8; --gold-soft:#E3EEFB; --hl:#1F63B5; --on-gold:#FFFFFF; --mark-b:#8EC0FF;
  --ok:#2F7D55; --ok-soft:#E4F2EA; --warn:#B04A2E; --warn-soft:#FBEAE4;
  --a:#1F63B5; --d1:#0E7C6E; --d2:#6B3FA8; --i:#B8640E; --e:#B8263A;
  --f-display:"Noto Naskh Arabic","IBM Plex Sans Arabic",Tahoma,serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px; --ease:cubic-bezier(.3,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131E; --surface:#141E2C; --sunk:#1C2838; --line:#26344A; --ink:#E9EEF6; --muted:#A9B5C8; --faint:#93A0B6;
  --brand:#8EC0FF; --brand-soft:#1A2A40; --on-brand:#0C131E; --gold:#5FA3F0; --gold-soft:#16273D; --hl:#8EC0FF; --on-gold:#0C131E; --mark-b:#0F2A4A;
  --ok:#6CCB97; --ok-soft:#18301F; --warn:#F0937A; --warn-soft:#3A1F17;
  --a:#7DB0F0; --d1:#4FC7B5; --d2:#B99CEB; --i:#F0A65A; --e:#F08394; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131E; --surface:#141E2C; --sunk:#1C2838; --line:#26344A; --ink:#E9EEF6; --muted:#A9B5C8; --faint:#93A0B6;
  --brand:#8EC0FF; --brand-soft:#1A2A40; --on-brand:#0C131E; --gold:#5FA3F0; --gold-soft:#16273D; --hl:#8EC0FF; --on-gold:#0C131E; --mark-b:#0F2A4A;
  --ok:#6CCB97; --ok-soft:#18301F; --warn:#F0937A; --warn-soft:#3A1F17;
  --a:#7DB0F0; --d1:#4FC7B5; --d2:#B99CEB; --i:#F0A65A; --e:#F08394; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.9;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
h1,h2{font-family:var(--f-display);font-weight:700}
h1{font-size:clamp(38px,7vw,56px)}
h2{font-size:clamp(28px,5vw,36px)}
h3{font-size:20px;font-weight:700}
p{margin:0}
.hl{color:var(--hl)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* station bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;max-width:1000px}
.mark{height:40px;padding:0 10px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;font-weight:700;font-size:14px;letter-spacing:.5px;flex:none;direction:ltr;white-space:nowrap}
.mark b{color:var(--mark-b)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;flex:none}
.seg button{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;font-size:15px;font-weight:600;color:var(--faint);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:3px solid var(--gold)}
.stations{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding-block:2px}
.stations::-webkit-scrollbar{display:none}
.st{all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.st:hover{color:var(--brand)}
.st[aria-current="step"],.st[aria-current="true"]{background:var(--brand);color:var(--on-brand)}
.st .ok{color:var(--ok);font-size:13px}
.st[aria-current] .ok{color:var(--gold)}
.st:focus-visible{outline:3px solid var(--gold)}

/* common blocks */
main{padding-block:44px 80px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--brand);font-size:15px;font-weight:600}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--gold)}
.by{color:var(--muted);font-size:15px;line-height:1.7}
.lead{font-size:20px;line-height:1.9;max-width:62ch}
.stack{display:grid;gap:18px}
.section{display:grid;gap:18px;padding-top:56px;scroll-margin-top:90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:10px;min-width:0}
.card.edge{border-right:4px solid var(--gold)}
.card.soft{background:var(--sunk);border-color:transparent}
.card.brand{background:var(--brand-soft);border-color:transparent;border-right:4px solid var(--gold)}
.card h3.brand{color:var(--brand)}
.label{font-size:14px;color:var(--faint);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
ul.clean{margin:0;padding:0 20px 0 0;display:grid;gap:6px}
ul.clean li::marker{color:var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:700;font-size:16px;background:var(--brand);color:var(--on-brand);line-height:1.4;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.danger{background:var(--warn);color:var(--on-brand)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:15px;color:var(--muted)}
.status.ok{color:var(--ok);font-weight:700}

/* forms */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px;font-size:15px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:120px;resize:vertical;line-height:1.8}

/* hero contrast */
.versus{display:grid;gap:12px}

/* apply mode */
.step-head{display:grid;gap:12px}
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--faint);font-weight:600}
.track{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .4s var(--ease)}
.phase-tag{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--c)}
.phase-tag b{width:38px;height:38px;border-radius:10px;background:var(--c);color:var(--on-brand);display:grid;place-items:center;font-size:18px;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;font-size:15px;padding:7px 14px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip.static{cursor:default}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.chip:focus-visible{outline:3px solid var(--gold)}
.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .2s}
.check input{width:20px;height:20px;margin-top:6px;accent-color:var(--brand);flex:none}
.check:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.check input:checked+span{color:var(--muted)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.more summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--brand);font-size:20px;line-height:1}
details.more[open] summary::after{content:"−"}
details.more .inner{padding:0 18px 16px;display:grid;gap:10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.objective{font-size:20px;font-weight:600;line-height:1.8;padding:18px 20px;border-radius:12px;background:var(--brand-soft);color:var(--ink)}
.objective .ph{color:var(--faint);font-weight:500}
.saved{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.saved li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.saved small{color:var(--faint);font-size:13px;margin-inline-start:8px}
.x{all:unset;cursor:pointer;color:var(--warn);font-size:14px;font-weight:600;padding:4px 8px;border-radius:6px;flex:none}
.x:focus-visible{outline:2px solid var(--gold)}
.acts{display:grid;gap:12px}
.act{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.act.on{border-color:var(--brand);background:var(--brand-soft)}
.act .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.act .meta span{padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.act .meta .ty{background:var(--gold-soft);color:var(--ink)}
.act ol{margin:0;padding:0 20px 0 0;font-size:15px}
.act-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pick{all:unset;cursor:pointer;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand);white-space:nowrap;flex:none}
.pick[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.pick:focus-visible{outline:3px solid var(--gold)}
.calc-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden}
.bar span{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:13px;color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
tfoot td{font-weight:700}
pre.tpl{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:15px;line-height:1.9;background:var(--sunk);border-radius:12px;padding:18px;max-height:380px;overflow:auto}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kp b{display:block;color:var(--e)}
.ph-progress{display:grid;gap:10px}
.ph-row{display:grid;grid-template-columns:90px minmax(0,1fr) 54px;gap:12px;align-items:center;font-weight:600}
.ph-row .track i{background:var(--c)}
.ph-row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:left;direction:ltr}
.sheets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheets div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:15px}
.sheets b{color:var(--brand);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* learn mode */
.phases{display:grid;gap:12px}
.ph-card{all:unset;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.ph-card:hover{border-color:var(--c)}
.ph-card:focus-visible{outline:3px solid var(--gold)}
.ph-card .lt{width:52px;height:52px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;direction:ltr}
.ph-card .nm{font-size:19px;font-weight:700}
.ph-card .nm small{display:block;font-size:14px;color:var(--muted);font-weight:500;line-height:1.6}
.ph-card .chev{color:var(--c);font-size:22px;transition:transform .3s var(--ease)}
.ph-card[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.ph-detail{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:20px 22px;display:grid;gap:14px}
.case-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.case-row:last-child{border-bottom:0}
.case-row b{color:var(--c)}
.quiz{display:grid;gap:14px}
.opt{all:unset;cursor:pointer;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt:focus-visible{outline:3px solid var(--gold)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}
.score{text-align:center;display:grid;gap:12px;justify-items:center}
.score b{font-size:48px;color:var(--brand);font-variant-numeric:tabular-nums}
.author{display:flex;gap:18px;align-items:center}
.author img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none}
.author h3{font-size:22px}
.cta{background:#0F2A4A;color:#FFFFFF;border-radius:var(--r);padding:28px;display:grid;gap:14px;justify-items:start}
.cta h2{color:#FFFFFF}
.cta p{color:#C3D2E6}
footer{text-align:center;color:var(--faint);font-size:14px;padding-block:24px 40px}

@media (max-width:640px){
  .nav .wrap{flex-wrap:wrap;gap:10px}
  .stations{flex-basis:100%;order:3}
  .fields,.grid2,.calc-in,.kp,.sheets{grid-template-columns:minmax(0,1fr)}
  .case-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .author{flex-direction:column;text-align:center}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="nav" aria-label="محطات الأداة">
  <div class="wrap">
    <div class="mark" aria-hidden="true">A<b>D</b>DIE</div>

    </div>
    <div class="stations" id="stations"></div>
  </div>
</nav>

<main class="wrap">

</main>
<footer class="wrap">© 2026 فهد الشمري · أداة ADDIE للمدربين</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script>
const $=id=>document.getElementById(id);

const AR=n=>Math.round(n).toLocaleString("ar-SA");
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
function copyText(btn,text,label){

}

/* ---------- content ---------- */

 a:{k:"A",en:"Analysis",n:"التحليل",c:"--a",q:"لماذا نحتاج هذا التدريب؟ ولمن؟ وما الفجوة بين الأداء الحالي والمطلوب؟",
  qs:["من هم المتعلمون؟ وما خبراتهم السابقة؟","ما المشكلة أو الفجوة في الأداء؟","هل التدريب هو الحل فعلًا؟","ما القيود: الوقت، الميزانية، التقنية؟"],
  tools:["استبانات ومقابلات","تحليل المهام (Task Analysis)","ملاحظة الأداء الميداني","تحليل SWOT"],
  out:["تقرير تحليل الاحتياج التدريبي","ملف خصائص المتعلمين","الأهداف العامة للبرنامج","قائمة القيود والموارد"],
  mis:["البدء بإعداد المحتوى قبل فهم المتعلم","الاكتفاء برأي المدير دون سماع الموظفين","افتراض أن كل مشكلة أداء حلّها تدريب","تجاهل القيود التقنية والزمنية مبكرًا"],
  ex:"ارتفعت شكاوى العملاء ٣٠٪ خلال ربع سنة. كشفت المقابلات والملاحظة أن الموظفين الجدد لا يعرفون خطوات احتواء العميل الغاضب، بينما الأنظمة والإجراءات واضحة. الفجوة مهارية، فالتدريب حل مناسب.",

function saveAll(){store.set("addie-chk",state);store.set("addie-notes",notes);store.set("addie-info",info);store.set("addie-objs",objs);store.set("addie-acts",picks);store.set("addie-time",tset)}
function doneCount(){let n=0,t=0;allKeys.forEach(k=>{n+=(state[k]||[]).length;t+=P[k].chk.length});return [n,t]}

/* ---------- time plan (pure) ---------- */
function computeTime(s){
  const d=Math.max(1,Math.min(10,+s.d||1)),h=Math.max(1,Math.min(8,+s.h||1)),ax=Math.max(1,Math.min(12,+s.ax||1)),ratio=+s.ratio||0.6;
  const rows=[];const T={o:0,b:0,p:0,a:0,c:0};
  for(let i=0;i<d;i++){const M=h*60,o=i===0?30:15,c=i===d-1?30:15,b=Math.max(0,Math.ceil(M/90)-1)*15,learn=Math.max(0,M-o-c-b);
    const r={day:i+1,M,o,b,p:learn*(1-ratio),a:learn*ratio,c};rows.push(r);T.o+=o;T.b+=b;T.p+=r.p;T.a+=r.a;T.c+=c}
  const tot=d*h*60;return {d,h,ax,ratio,rows,T,tot,learnTot:T.p+T.a};
}
let lastCalc=computeTime(tset);
const hm=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${AR(h)} س${r?" "+AR(r)+" د":""}`:`${AR(r)} د`};

/* ---------- modes & stations ---------- */
const STEPS=[
  {id:"start",n:"ابدأ"},{id:"a",n:"حلّل"},{id:"d1",n:"صمّم"},{id:"d2",n:"طوّر"},{id:"i",n:"نفّذ"},{id:"e",n:"قوّم"},{id:"done",n:"خطتك"}];
const LEARN=[{id:"s-idea",n:"افهم"},{id:"s-why",n:"لماذا"},{id:"s-phases",n:"المراحل"},{id:"s-case",n:"مثال"},{id:"s-eval",n:"قِس الأثر"},{id:"s-quiz",n:"اختبر نفسك"},{id:"s-about",n:"عن المُعِد"}];
let mode=store.get("addie-mode",null)||(location.hash==="#apply"?"apply":"learn");
if(location.hash==="#learn")mode="learn";if(location.hash==="#apply")mode="apply";
let step=Math.max(0,Math.min(STEPS.length-1,store.get("addie-step",0)));
let learnCur="s-idea";

function phaseDone(k){return (state[k]||[]).length===P[k].chk.length}
function renderStations(){
  const box=$("stations");
  if(mode==="apply"){
    box.innerHTML=STEPS.map((s,i)=>{const ok=P[s.id]&&phaseDone(s.id);return `<button type="button" class="st" data-step="${i}" ${i===step?'aria-current="step"':""}>${AR(i+1)}. ${s.n}${ok?'<span class="ok" aria-label="مكتملة">✓</span>':""}</button>`}).join("");
  }else{
    box.innerHTML=LEARN.map((s,i)=>`<button type="button" class="st" data-sec="${s.id}" ${s.id===learnCur?'aria-current="true"':""}>${AR(i+1)}. ${s.n}</button>`).join("");
  }
  const cur=box.querySelector("[aria-current]");if(cur){try{box.scrollTo({left:cur.offsetLeft-box.clientWidth/2+cur.offsetWidth/2,behavior:"smooth"})}catch(e){}}
}
function setMode(m,scroll){
  mode=m;store.set("addie-mode",m);
  $("m-apply").setAttribute("aria-pressed",m==="apply");$("m-learn").setAttribute("aria-pressed",m==="learn");
  $("apply").hidden=m!=="apply";$("learn").hidden=m!=="learn";
  if(m==="apply")renderStep();renderStations();
  if(scroll!==false)window.scrollTo({top:0,behavior:"smooth"});
}
$("m-apply").addEventListener("click",()=>setMode("apply"));
$("m-learn").addEventListener("click",()=>setMode("learn"));
$("stations").addEventListener("click",e=>{
  const s=e.target.closest("[data-step]");if(s){goStep(+s.dataset.step);return}
  const l=e.target.closest("[data-sec]");if(l){learnCur=l.dataset.sec;renderStations();$(l.dataset.sec).scrollIntoView({behavior:"smooth",block:"start"})}
});
function goStep(i){step=Math.max(0,Math.min(STEPS.length-1,i));store.set("addie-step",step);renderStep();renderStations();window.scrollTo({top:0,behavior:"smooth"})}

const FIELDS=[["name","اسم البرنامج","مثال: مهارات التواصل الفعّال"],["aud","الفئة المستهدفة","مثال: موظفو خدمة العملاء الجدد"],["dur","المدة","مثال: يومان × ٥ ساعات"],["trainer","اسم المدرب","مثال: أ. سارة العتيبي"],["org","الجهة المستفيدة","مثال: إدارة خدمة العملاء"],["date","تاريخ التنفيذ","مثال: ١٥ ديسمبر ٢٠٢٦"]];
function head(){

}
function pager(){
  const prev=step>0?`<button class="btn quiet" type="button" data-go="${step-1}">→ السابق</button>`:"<span></span>";
  const next=step<STEPS.length-1?`<button class="btn" type="button" data-go="${step+1}">${step===0?"ابدأ بالتحليل":"التالي: "+STEPS[step+1].n} ←</button>`:"";

}

function renderStep(){

}
const applyBox=$("apply");
applyBox.addEventListener("input",e=>{

});

const TYPES=["الكل","كسر الجمود","تفاعل","تطبيق","تقويم"];let af="الكل";
function acts(){const fb=$("a-filters");if(!fb)return;

  ws3.views=[{rightToLeft:true,showGridLines:false,state:"frozen",ySplit:4}];
  r+=1;ws3.mergeCells(`A${r}:E${r}`);const n3=ws3.getCell(`A${r}`);n3.value="الصفوف الفاتحة جاهزة لإضافة أهداف أخرى. اكتب الهدف بصيغة: أن + فعل سلوكي + الفئة + الظرف + المعيار.";
  styleCell(n3,{color:XC.muted,size:10,border:false});ws3.getRow(r).height=22;

  /* ---- 4: time plan ---- */
  const c=lastCalc,m=v=>Math.round(v);
  const w4=[24,14,18,18,14,16,14];
  const ws4=newSheet(wb,NM.s4,{title:"الجدول الزمني للبرنامج",sub,widths:w4,tab:XPH.i[0]});
  sectionTitle(ws4,4,"الإعدادات",7);
  r=5;[["عدد الأيام",c.d,"0"],["ساعات اليوم",c.h,"0.0"],["عدد المحاور",c.ax,"0"],["نسبة التطبيق من وقت التعلم",c.ratio,"0%"]].forEach(([l,v,f])=>{
    const row=ws4.getRow(r);const a=row.getCell(1);a.value=l;styleCell(a,{bold:true,fill:XC.navySoft,color:XC.navy});
    const b=row.getCell(2);b.value=v;styleCell(b,{h:"center",indent:0,numFmt:f,bold:true});row.height=24;r++});
  r+=1;sectionTitle(ws4,r,"توزيع الوقت لكل يوم (بالدقائق)",7);r++;
  header(ws4,r,["اليوم","افتتاح","عرض ومناقشة","أنشطة تطبيقية","استراحات","ختام وتقويم","المجموع"],w4);r++;
  const firstDay=r;
  c.rows.forEach(d=>{const row=bodyRow(ws4,r,[`اليوم ${d.day}`,m(d.o),m(d.p),m(d.a),m(d.b),m(d.c),{formula:`SUM(B${r}:F${r})`,result:m(d.o)+m(d.p)+m(d.a)+m(d.b)+m(d.c)}],w4,
    {zebra:true,center:[1,2,3,4,5,6],boldCols:[0,6],numFmts:[undefined,"0","0","0","0","0","0"],fills:[XPH.i[1]],colors:[XPH.i[0]]});r++});
  const tot=ws4.getRow(r);
  ["الإجمالي","B","C","D","E","F","G"].forEach((col,i)=>{const cell=tot.getCell(i+1);cell.value=i===0?col:{formula:`SUM(${col}${firstDay}:${col}${r-1})`};
    styleCell(cell,{bold:true,fill:XC.navy,color:XC.white,h:i===0?"right":"center",indent:i===0?1:0,numFmt:i?"0":undefined})});
  tot.height=28;const totRow=r;
  r+=2;sectionTitle(ws4,r,"توزيع المحاور",7);r++;
  header(ws4,r,["المحور","الزمن (دقيقة)","اليوم","الأنشطة المستخدمة","","",""],w4);ws4.mergeCells(`D${r}:G${r}`);r++;
  for(let i=1;i<=c.ax;i++){bodyRow(ws4,r,[`المحور ${i}`,{formula:`ROUND((C${totRow}+D${totRow})/${c.ax},0)`,result:m(c.learnTot/c.ax)},"","","","",""],w4,
    {zebra:true,center:[1,2],boldCols:[0],numFmts:[undefined,"0"],fills:[undefined,undefined,XC.empty,XC.empty,XC.empty,XC.empty,XC.empty]});ws4.mergeCells(`D${r}:G${r}`);r++}
  r+=1;ws4.mergeCells(`A${r}:G${r}`);const n4=ws4.getCell(`A${r}`);
  n4.value="الافتراضات: افتتاح ١٥ دقيقة يوميًا (٣٠ في اليوم الأول)، وختام ١٥ دقيقة (٣٠ في اليوم الأخير)، واستراحة ١٥ دقيقة بعد كل ٩٠ دقيقة تقريبًا. عدّل أي رقم وتتحدّث المجاميع.";
  styleCell(n4,{color:XC.muted,size:10,border:false});ws4.getRow(r).height=34;

  /* ---- 5: activities ---- */
  const w5=[26,13,9,16,64,18];
  const ws5=newSheet(wb,NM.s5,{title:"الأنشطة التدريبية المختارة",sub,widths:w5,tab:XPH.d2[0]});
  header(ws5,4,["النشاط","النوع","المدة","حجم المجموعة","خطوات التنفيذ","المحور / اليوم"],w5);
  r=5;const sel=ACTS.filter(a=>picks.includes(a[1]));
  sel.forEach(([ty,nm,d,g,st])=>{bodyRow(ws5,r,[nm,ty,d,g,st.map((x,i)=>`${i+1}. ${x}`).join("\n"),""],w5,{zebra:true,boldCols:[0],colors:[XPH.d2[0]],center:[1,2,3],fills:[undefined,undefined,undefined,undefined,undefined,XC.empty]});r++});
  for(let i=0;i<Math.max(3,6-sel.length);i++){bodyRow(ws5,r,["","","","","",""],w5,{fill:XC.empty,min:30});r++}
  ws5.views=[{rightToLeft:true,showGridLines:false,state:"frozen",ySplit:4}];

  /* ---- 6: evaluation ---- */
  const w6=[18,30,26,24,18,22];
  const ws6=newSheet(wb,NM.s6,{title:"خطة التقويم وفق نموذج كيركباتريك",sub,widths:w6,tab:XPH.e[0]});
  header(ws6,4,["المستوى","ماذا نقيس؟","الأداة المقترحة","التوقيت","المسؤول","النتيجة"],w6);
  [["١. رد الفعل","رضا المتدربين عن البرنامج","استبانة الرضا","نهاية البرنامج"],
   ["٢. التعلم","ما اكتسبوه من معارف ومهارات","اختبار قبلي وبعدي","بداية البرنامج ونهايته"],
   ["٣. السلوك","تطبيق المهارة في بيئة العمل","بطاقة ملاحظة الأداء","بعد شهر إلى ثلاثة أشهر"],
   ["٤. النتائج","الأثر على مؤشرات الجهة","مقارنة المؤشرات قبل وبعد","بعد ثلاثة إلى ستة أشهر"]].forEach((v,i)=>{
     bodyRow(ws6,5+i,[...v,"",""],w6,{fills:[XPH.e[1],XC.white,XC.white,XC.white,XC.empty,XC.empty],colors:[XPH.e[0]],boldCols:[0],min:36})});

  wb.views=[{activeTab:0,firstSheet:0,visibility:"visible"}];
  return wb;
}

let DL=null;
async function downloadXlsx(){
  const btn=$("xlsx"),st=$("x-status");if(!DL||!btn)return;
  st.className="status";st.textContent="جارٍ تجهيز الملف…";btn.disabled=true;
  try{const wb=await buildWorkbook();const buf=await wb.xlsx.writeBuffer();
    const name=(info.name||"خطة برنامج تدريبي").replace(/[\\/:*?"<>|]/g,"").slice(0,60);
    await DL.save({filename:`${name} - ADDIE.xlsx`,data:new Uint8Array(buf)});
    st.className="status ok";st.textContent="نزل ملف الخطة على جهازك."}
  catch(e){console.error(e);st.className="status";st.textContent=e&&e.code==="declined"?"أُلغي التنزيل.":"تعذّر تنزيل الملف الآن. جرّب مرة أخرى، أو انسخ الخطة نصًا."}
  btn.disabled=false}

/* ---------- boot ---------- */
renderLearn();
if(obs)LEARN.forEach(s=>{const el=$(s.id);if(el)obs.observe(el)});
setMode(mode,false);
DL={save:async({filename,data})=>{
  const blob=new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {status:"saved"}}};
if(typeof ExcelJS==="undefined")DL=null;
{const b=$("xlsx");if(b)b.hidden=!DL}
</script>
